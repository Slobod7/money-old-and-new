# Money, Old and New: site settings.
# Lines marked CHANGE ME need your real details before launch.

title: "Money, Old and New"
tagline: "Macro, through your wallet"
description: "A free Sunday letter for people in Europe on what the ECB, inflation and markets mean for your money, old and new. Written by Bogdan Slobodzean."
lang: en
# The site lives at the root of its own domain. The CNAME file must name the same domain.
url: "https://moneyoldandnew.com"
baseurl: ""

author:
  name: Bogdan Slobodzean
  initials: BS
  email: slobodzeanb@gmail.com
  linkedin: https://www.linkedin.com/in/bogdanslobodzean/
  photo: /assets/img/bogdan.jpg      # 4:5 portrait, beside the About introduction
  avatar: /assets/img/bogdan-square.jpg   # square, cropped close to the face, for the circle on the home page. Empty uses photo
  # For search engines only (the schema.org Person in _includes/schema.html). None of this shows on the page.
  job_title: Content Writer
  employer:
    name: Bitcoin.com
    url: https://www.bitcoin.com/
  knows_about:
    - Macroeconomics
    - Monetary policy
    - Central banks
    - Stablecoins
    - Cryptocurrency
    - Personal finance
  # Other profiles that are you, such as your Bitcoin.com author page or X. LinkedIn and the Substack address are added automatically
  same_as: []

# Your Substack newsletter. Every "Subscribe" button on the site points to its signup page.
# While this still says YOUR-NAME, the buttons are replaced by "Signup isn't open yet".
substack_url: "https://YOUR-NAME.substack.com"   # CHANGE ME: later your own subdomain, e.g. https://newsletter.slobodzean.com

# The Reviewed series: what each verdict scores out of review_scale. The score shows beside the verdict
# and becomes the review's star rating in search results. Change the scale and the scores together.
review_scale: 3
review_scores:
  Read it: 3
  Use it: 3
  Skim it: 2
  Try it: 2
  Skip it: 1

# Guides live at short, permanent addresses like /what-is-pump-fun/
permalink: /:title/

# A post dated in the future stays off the site until a build after that date. GitHub Pages defaults to true, which
# would publish it straight away. .github/workflows/sunday-rebuild.yml starts a build every Sunday at 08:15 UTC.
future: false

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

feed:
  path: feed.xml

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - scripts   # the oil data script (run by .github/workflows/update-oil-data.yml)
  - tests     # the oil calculator's maths test, opened straight from the folder
