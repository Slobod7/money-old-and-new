<!-- A sheet with a line chart over bars, between old money (coins) and new money (blocks). The shapes are made up, not real data. Drawn for this site. -->
<style>
.illustration .ink { fill: none; stroke: var(--on-forest); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
