.illustration .grid { fill: none; stroke: #CFDCD3; stroke-width: 1.25; }
.illustration .bar { fill: #CFDCD3; }
.illustration .bar-on { fill: var(--accent); }
.illustration .line { fill: none; stroke: var(--forest); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.illustration .dot { fill: var(--on-forest); stroke: var(--forest); stroke-width: 2; }
.illustration .c-top { fill: #DCE7E0; }
.illustration .c-left { fill: var(--sage); }
.illustration .c-right { fill: #86A898; }
.illustration .c-top, .illustration .c-left, .illustration .c-right { stroke: var(--forest); stroke-width: 1.5; stroke-linejoin: round; }
</style>
