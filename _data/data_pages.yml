# The cards on the Data page (data/index.html), in this order. To add a card, put the page in data/ and add an entry.
- label: Calculator
  title: Euro inflation calculator
  description: "What your euros would be worth today, across seven kinds of savings and investment."
  url: /data/euro-inflation-calculator/
- label: Scenario calculator
  title: Investment calculator with inflation
  description: "Model monthly savings with your own return, inflation and fee assumptions."
  url: /data/investment-calculator-with-inflation/
- label: Chart
  title: ECB interest rates
  description: "The ECB’s main rates against euro area inflation, by month."
  url: /data/ecb-interest-rates/
- label: Chart
  title: Inflation by country
  description: "Every EU country’s inflation rate, ranked, and each one against the euro area since 1999."
  url: /data/inflation-by-country/
- label: Chart
  title: Brent oil price history
  description: "The price of a barrel since 1990, with a calculator."
  url: /data/brent-oil-price-history/
- label: Map
  title: Petrol and diesel prices in Europe
  description: "A litre in each EU country this week, and how much of it is tax."
  url: /data/europe-fuel-prices/
