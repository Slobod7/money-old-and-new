# Money, Old and New: site settings.
# Lines marked CHANGE ME need your real details before launch.

title: "Money, Old and New"
tagline: "Finance and crypto, explained"
description: "A Sunday letter about how money works, from bank deposits to blockchains. Written by Bogdan Slobodzean."
lang: en
# For now the site lives at https://slobod7.github.io/money-old-and-new/
# When you connect your own domain: set url to it (e.g. https://slobodzean.com) and baseurl to "".
url: "https://slobod7.github.io"
baseurl: "/money-old-and-new"

author:
  name: Bogdan Slobodzean
  initials: BS
  email: slobodzeanb@gmail.com
  city: Cluj-Napoca
  linkedin: https://www.linkedin.com/in/bogdanslobodzean/
  photo: ""                          # CHANGE ME: e.g. /assets/img/bogdan.jpg (a portrait photo, at least 600px tall)
  # About page details. Each one appears on the page only once it's filled in.
  outline_time: ""                   # e.g. "three working days"
  edit_rounds: ""                    # e.g. "two rounds"
  testimonial: ""                    # a real one-line quote from a past editor or client
  testimonial_by: ""                 # their name and role

# Your Substack newsletter. Every "Subscribe" button on the site points to its signup page.
# While this still says YOUR-NAME, the buttons are replaced by "Signup isn't open yet".
substack_url: "https://YOUR-NAME.substack.com"   # CHANGE ME: later your own subdomain, e.g. https://newsletter.slobodzean.com

# Starter Kit
kit:
  price: "[PRICE]"                   # CHANGE ME when you know it, e.g. "$29". Hidden while it has brackets.
  launch: "January 2027"
  # Starter Kit questions. Each answer appears only once it's filled in.
  format: ""                         # e.g. "Google Docs and Notion"
  licence: ""                        # your licence terms
  refunds: ""                        # your refund policy

# Guides live at short, permanent addresses like /top-layer-1-blockchains-2026/
permalink: /:title/

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

feed:
  path: feed.xml

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
    values:
      image: /assets/img/guides/layer-1-2026/what-changed-2025-2026.png

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
