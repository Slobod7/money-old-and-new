# Updates the data behind the charts twice a month, and checks the review dates of the facts typed by hand.
# On the 18th, and when run by hand, it runs scripts/update-oil-data.py (the oil widgets), scripts/update-ecb-data.py
# (the ECB rates chart), scripts/update-old-new-data.py (the old-vs-new calculator), scripts/update-inflation-data.py
# (inflation by country) and scripts/update-minimum-wage-data.py (minimum wages in Europe), and commits their files,
# but only when the data changed.
# On the 2nd it runs only the first two. By then they can pick up the euro area's flash inflation estimate (Eurostat
# publishes it at the end of the month or in its first days), any ECB rate change that took effect after the 18th, and
# two more weeks of Brent prices. The other three sources publish later in the month: run on the 2nd, they would find
# nothing new, and the old-vs-new script could call its data stale days before its sources catch up.
# If a download fails or looks wrong, that script stops with an error and leaves its files as they were: the other
# scripts' updates are still committed, the old data stays on the site, and this run shows as failed (GitHub emails
# you about failed runs).
# The second job, "Check the review dates", runs scripts/check-review-dates.py on both days. Once a fact typed by hand
# has passed the date it must be checked by (in _data/review_dates.yml), that job fails, so GitHub emails you.
name: Update oil data

on:
  schedule:
    - cron: '30 6 2 * *'    # 06:30 UTC on the 2nd: the oil and ECB data only. Three steps below skip this run by
                            # naming this exact line, so change them with it
    - cron: '30 6 18 * *'   # 06:30 UTC on the 18th: everything, after the month's US CPI, euro area HICP and EIA's weekly Brent update
  workflow_dispatch:         # to run it by hand: Actions → Update oil data → Run workflow

permissions:
  contents: write   # to push the data commit
  pages: write      # to ask GitHub Pages to rebuild: a push made with GITHUB_TOKEN doesn't start a Pages build

concurrency:
  group: update-oil-data

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Download the oil data and rebuild its files
        run: python3 scripts/update-oil-data.py

      - name: Download the ECB data and rebuild its file
        if: ${{ !cancelled() }}   # runs even if the oil data failed
        run: python3 scripts/update-ecb-data.py

      - name: Download the old-vs-new data and rebuild its files
        if: ${{ !cancelled() && github.event.schedule != '30 6 2 * *' }}   # not on the 2nd; runs even if the others failed
        run: python3 scripts/update-old-new-data.py

      - name: Download inflation by country and rebuild its files
        if: ${{ !cancelled() && github.event.schedule != '30 6 2 * *' }}   # not on the 2nd; runs even if the others failed
        run: python3 scripts/update-inflation-data.py

      - name: Download minimum wages and rebuild their files
        if: ${{ !cancelled() && github.event.schedule != '30 6 2 * *' }}   # not on the 2nd; runs even if the others failed
        run: python3 scripts/update-minimum-wage-data.py

      - name: Commit if the data changed
        id: commit
        if: ${{ !cancelled() }}
        run: |
          oil_files="assets/data/oil.json _data/brent_annual.json"
          ecb_files="_data/ecb_rates_inflation.json"
          old_new_files="assets/data/old-new.json _data/old_new.json"
          inflation_files="_data/inflation_by_country.json assets/data/inflation-by-country.json"
          wage_files="_data/minimum_wage_europe.json assets/data/minimum-wage-europe.json"
          parts=()
          if ! git diff --quiet -- $oil_files; then
            parts+=("Brent to $(python3 -c 'import json; print(json.load(open("assets/data/oil.json"))["brent_to"])')")
          fi
          if ! git diff --quiet -- $ecb_files; then
            parts+=("euro area inflation to $(python3 -c 'import json; print(json.load(open("_data/ecb_rates_inflation.json"))["hicp_to"])')")
          fi
          if ! git diff --quiet -- $old_new_files; then
            parts+=("old-vs-new calculator to $(python3 -c 'import json; print(json.load(open("assets/data/old-new.json"))["to"])')")
          fi
          if ! git diff --quiet -- $inflation_files; then
            parts+=("inflation by country to $(python3 -c 'import json; print(json.load(open("_data/inflation_by_country.json"))["to"])')")
          fi
          if ! git diff --quiet -- $wage_files; then
            parts+=("minimum wages to $(python3 -c 'import json; print(json.load(open("_data/minimum_wage_europe.json"))["date"])')")
          fi
          if [ ${#parts[@]} -eq 0 ]; then
            echo "No change in the data, so nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $oil_files $ecb_files $old_new_files $inflation_files $wage_files
          message=$(printf '%s, ' "${parts[@]}")
          git commit -m "Update chart data: ${message%, }"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Ask GitHub Pages to rebuild the site
        if: ${{ !cancelled() && steps.commit.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"

  review-dates:
    name: Check the review dates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read   # it only reads the files
    steps:
      - uses: actions/checkout@v5

      - name: Check the facts typed by hand against their review dates
        run: python3 scripts/check-review-dates.py
