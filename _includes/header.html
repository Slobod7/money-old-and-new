{%- assign path = page.url -%}
<header class="site-header">
<div class="wrap">
<div class="masthead">
<a class="brand" href="{{ '/' | relative_url }}"{% if path == '/' %} aria-current="page"{% endif %}>
<img class="brand-wordmark" src="{{ '/assets/brand/wordmark.svg' | relative_url }}" alt="{{ site.title }}" width="1200" height="180">
<img class="brand-gateway" src="{{ '/assets/brand/gateway.svg' | relative_url }}" alt="{{ site.title }}" width="40" height="40">
</a>
<nav class="site-nav" aria-label="Main">
<a href="{{ '/guides/' | relative_url }}"{% if path == '/guides/' or page.layout == 'post' %} aria-current="page"{% endif %}>Guides</a>
<a href="{{ '/about/' | relative_url }}"{% if path == '/about/' %} aria-current="page"{% endif %}>About</a>
<a href="{{ '/subscribe/' | relative_url }}"{% if path == '/subscribe/' %} aria-current="page"{% endif %}>Subscribe</a>
</nav>
</div>
</div>
</header>
